<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ===== Wordless comic engine. An episode file defines: DUR, CUES, CAST, scene(t) =====
const W=1080,H=1920;const cv=document.getElementById('c');const ctx=cv.getContext('2d');
const PI=Math.PI;
// ---------- timing helpers ----------
const ease={lin:x=>x,in:x=>x*x,out:x=>1-(1-x)*(1-x),io:x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,
 back:x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},
 bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375},
 elastic:x=>x===0||x===1?x:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*PI/3))+1};
// key(t, [[t0,v0],[t1,v1,'ease'],...]) numbers tween, strings/objects step
function key(t,ks){if(t<=ks[0][0])return ks[0][1];for(let i=1;i<ks.length;i++){const[a,va]=ks[i-1],[b,vb,e]=ks[i];
 if(t<b){if(typeof va!=='number'||typeof vb!=='number')return va;const p=(t-a)/(b-a);return va+(vb-va)*(ease[e||'io'])(p)}}return ks[ks.length-1][1]}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const prog=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function rnd(s){const x=Math.sin(s*12.9898)*43758.5453;return x-Math.floor(x)}
// ---------- drawing primitives ----------
const OUT='#1b1b24';let LW=9;
function path(fill,stroke=OUT,lw=LW){if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()}}
function ell(x,y,rx,ry,fill,stroke=OUT,lw=LW,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,2*PI);path(fill,stroke,lw)}
function rrect(x,y,w,h,r,fill,stroke=OUT,lw=LW){ctx.beginPath();ctx.roundRect(x,y,w,h,r);path(fill,stroke,lw)}
function line(pts,stroke=OUT,lw=LW){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);path(null,stroke,lw)}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
 if(k>0){r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k}else{r*=1+k;g*=1+k;b*=1+k}return`rgb(${r|0},${g|0},${b|0})`}
// ---------- character ----------
// spec: {body:'#hex', w, h, hat:'cap|top|bow|tuft|beanie|none', hatColor, stache:bool, cheeks:bool, legLen, armLen, brows:bool}
// pose: {x,y(feet),sx,sy,rot,look:[dx,dy],blink,mouth:'smile|grin|o|frown|flat|laugh|chomp|whistle|wide',brow:'up|angry|sad|none',
//        armL:deg,armR:deg, reachL, reachR (extra arm length), walk:phase or null, holdL:fn, holdR:fn, eyes:'normal|squint|big|x|spiral', flip}
function drawChar(sp,p,t){
 const w=sp.w,h=sp.h,legL=sp.legLen||70;
 ctx.save();ctx.translate(p.x,p.y);
 // shadow
 ctx.save();ctx.globalAlpha=.18;ell(0,4,w*.55*(p.shadow??1),16,'#000',null);ctx.restore();
 const lift=p.lift||0;ctx.translate(0,-lift);
 ctx.rotate((p.rot||0)*PI/180);
 const sx=p.sx??1,sy=p.sy??1;if(p.flip)ctx.scale(-1,1);
 // legs
 const wp=p.walk;const la=wp==null?0:Math.sin(wp*2*PI)*18,lb=wp==null?0:-la;
 for(const[side,sw] of[[-1,la],[1,lb]]){const hx=side*w*.22*sx;
  line([hx,-legL*sy+2,hx+sw*.6,-6-Math.max(0,sw*.3)],OUT,14);ctx.lineWidth=14;
  ell(hx+sw*.6+side*12,-6-Math.max(0,sw*.3),24,12,sp.shoe||'#2b2b36',OUT,6)}
 ctx.translate(0,-legL*sy);
 ctx.scale(sx,sy);
 const cy=-h/2; // body center
 // arms (behind body for back arm? draw after body for simplicity)
 const shoulder=(side)=>[side*w*.42,cy+h*.08];
 function arm(side,deg,reach,hold){const[sx0,sy0]=shoulder(side);const L=(sp.armLen||95)+(reach||0);
  const a=(deg)*PI/180;const ex=sx0+side*Math.cos(a)*L,ey=sy0-Math.sin(a)*L;
  const mx=(sx0+ex)/2+side*10,my=(sy0+ey)/2+ (reach>60?Math.sin(t*30)*6:12)+((side<0?p.bendL:p.bendR)||0);
  ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.quadraticCurveTo(mx,my,ex,ey);path(null,OUT,26);
  ctx.beginPath();ctx.moveTo(sx0,sy0);ctx.quadraticCurveTo(mx,my,ex,ey);path(null,sp.body,14);
  if(hold){ctx.save();ctx.translate(ex,ey);if(p.flip)ctx.scale(-1,1);hold(t);ctx.restore()}
  ell(ex,ey,20,20,sp.hand||'#fff',OUT,7);
  return[ex,ey]}
 // body
 ctx.beginPath();
 const bw=w/2,bh=h/2;
 ctx.moveTo(0,cy-bh);ctx.bezierCurveTo(bw*1.05,cy-bh,bw*1.1,cy+bh*.2,bw*.95,cy+bh*.7);
 ctx.quadraticCurveTo(bw*.8,cy+bh,0,cy+bh);ctx.quadraticCurveTo(-bw*.8,cy+bh,-bw*.95,cy+bh*.7);
 ctx.bezierCurveTo(-bw*1.1,cy+bh*.2,-bw*1.05,cy-bh,0,cy-bh);ctx.closePath();
 path(sp.body);
 // belly
 ctx.save();ctx.clip();ell(0,cy+bh*.55,bw*.75,bh*.55,shade(sp.body,.28),null);
 ctx.globalAlpha=.25;ell(-bw*.45,cy-bh*.5,bw*.18,bh*.25,'#fff',null);ctx.restore();
 ctx.beginPath();ctx.moveTo(0,cy-bh);ctx.bezierCurveTo(bw*1.05,cy-bh,bw*1.1,cy+bh*.2,bw*.95,cy+bh*.7);
 ctx.quadraticCurveTo(bw*.8,cy+bh,0,cy+bh);ctx.quadraticCurveTo(-bw*.8,cy+bh,-bw*.95,cy+bh*.7);
 ctx.bezierCurveTo(-bw*1.1,cy+bh*.2,-bw*1.05,cy-bh,0,cy-bh);path(null);
 // face
 const fy=cy-bh*.38,ex=bw*.36,er=Math.min(bw*.3,46);const look=p.look||[0,0];
 const blink=p.blink||0;const eyes=p.eyes||'normal';
 for(const side of[-1,1]){const x=side*ex,y=fy;
  if(eyes==='x'){line([x-er*.6,y-er*.6,x+er*.6,y+er*.6],OUT,10);line([x-er*.6,y+er*.6,x+er*.6,y-er*.6],OUT,10);continue}
  const big=eyes==='big'?1.35:1;const ry=er*1.15*big*(eyes==='squint'?.35:1)*(1-blink*.92);
  ell(x,y,er*big,Math.max(ry,3),'#fff',OUT,7);
  if(ry>8){if(eyes==='spiral'){ctx.save();ctx.beginPath();for(let a=0;a<14;a+=.2){const r=a*2.6;ctx.lineTo(x+Math.cos(a+t*12)*r,y+Math.sin(a+t*12)*r)}path(null,OUT,5);ctx.restore()}
   else{const pr=er*.45*(eyes==='big'?.8:1);ctx.save();ctx.beginPath();ctx.ellipse(x,y,er*big,ry,0,0,2*PI);ctx.clip();
   ell(x+look[0]*er*.45,y+look[1]*er*.45,pr,pr,OUT,null);ell(x+look[0]*er*.45-pr*.35,y+look[1]*er*.45-pr*.35,pr*.3,pr*.3,'#fff',null);ctx.restore()}}
  // brows
  const br=p.brow||'none';if(br!=='none'||sp.brows){const by=y-er*1.35*(eyes==='big'?1.25:1);
   const tilt=br==='angry'?side*-14:br==='sad'?side*12:0;const up=br==='up'?-16:0;
   line([x-er*.7,by+up-tilt*.5*side*side,x+er*.7,by+up+tilt*.5],OUT,12)}
 }
 if(sp.cheeks){ctx.save();ctx.globalAlpha=.35;ell(-ex*1.6,fy+er*1.3,er*.5,er*.3,'#ff5a7a',null);ell(ex*1.6,fy+er*1.3,er*.5,er*.3,'#ff5a7a',null);ctx.restore()}
 // mouth
 const my=fy+er*1.75,m=p.mouth||'smile',mw=bw*.38;
 if(m==='smile'){ctx.beginPath();ctx.arc(0,my-mw*.6,mw*.8,PI*.2,PI*.8);path(null,OUT,9)}
 else if(m==='frown'){ctx.beginPath();ctx.arc(0,my+mw*.5,mw*.6,PI*1.2,PI*1.8);path(null,OUT,9)}
 else if(m==='flat'){line([-mw*.4,my,mw*.4,my],OUT,9)}
 else if(m==='o'){ell(0,my+6,mw*.22,mw*.3,'#5a1022',OUT,7)}
 else if(m==='whistle'){ell(mw*.15,my+4,mw*.14,mw*.14,'#5a1022',OUT,7)}
 else if(m==='wide'){ell(0,my+mw*.35,mw*.9,mw*.75,'#5a1022',OUT,8);ctx.save();ctx.beginPath();ctx.ellipse(0,my+mw*.35,mw*.9,mw*.75,0,0,2*PI);ctx.clip();ell(0,my+mw*1.05,mw*.5,mw*.35,'#ff6f8a',null);ctx.restore()}
 else if(m==='grin'||m==='laugh'){const open=m==='laugh'?(.6+.4*Math.abs(Math.sin(t*22))):.55;
  ctx.beginPath();ctx.moveTo(-mw,my-4);ctx.quadraticCurveTo(0,my-4-6,mw,my-4);ctx.quadraticCurveTo(mw*.8,my+mw*open*1.5,0,my+mw*open*1.5);ctx.quadraticCurveTo(-mw*.8,my+mw*open*1.5,-mw,my-4);ctx.closePath();
  path('#5a1022',OUT,8);ctx.save();ctx.clip();rrect(-mw,my-10,mw*2,mw*.28,4,'#fff',null);ell(0,my+mw*open*1.5,mw*.45,mw*.3,'#ff6f8a',null);ctx.restore();
  ctx.beginPath();ctx.moveTo(-mw,my-4);ctx.quadraticCurveTo(0,my-4-6,mw,my-4);ctx.quadraticCurveTo(mw*.8,my+mw*open*1.5,0,my+mw*open*1.5);ctx.quadraticCurveTo(-mw*.8,my+mw*open*1.5,-mw,my-4);path(null,OUT,8)}
 else if(m==='chomp'){const o=Math.abs(Math.sin(t*16));ell(0,my+8,mw*.6,4+mw*.4*o,'#5a1022',OUT,8);ell(-mw*.7,my-2,mw*.3,mw*.22,sp.body,null);ell(mw*.7,my-2,mw*.3,mw*.22,sp.body,null)}
 if(sp.stache){ctx.beginPath();ctx.moveTo(0,my-14);ctx.bezierCurveTo(-mw*.5,my-34,-mw*1.2,my-10,-mw*1.3,my-20);ctx.bezierCurveTo(-mw,my+6,-mw*.3,my,0,my-8);
  ctx.bezierCurveTo(mw*.3,my,mw,my+6,mw*1.3,my-20);ctx.bezierCurveTo(mw*1.2,my-10,mw*.5,my-34,0,my-14);path(sp.stacheColor||'#3a2a1e',OUT,6)}
 // hat
 const top=cy-bh;const hc=sp.hatColor||'#e23b3b';
 if(sp.hat==='cap'){ctx.beginPath();ctx.arc(0,top+bh*.32,bw*.62,PI*1.02,PI*1.98);ctx.closePath();path(hc);rrect(bw*.1,top+bh*.22,bw*.85,22,11,shade(hc,-.25))}
 else if(sp.hat==='top'){rrect(-bw*.42,top-140,bw*.84,150,10,hc);rrect(-bw*.42,top-40,bw*.84,24,0,'#d23',OUT,6);rrect(-bw*.75,top-2,bw*1.5,24,12,hc)}
 else if(sp.hat==='bow'){ctx.save();ctx.translate(bw*.35,top+20);ctx.rotate(-.3);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-48,-30);ctx.lineTo(-48,30);ctx.closePath();path(hc);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(48,-30);ctx.lineTo(48,30);ctx.closePath();path(hc);ell(0,0,14,14,shade(hc,.2));ctx.restore()}
 else if(sp.hat==='tuft'){for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*14,top+6);ctx.quadraticCurveTo(i*30,top-60,i*40+10,top-50+Math.sin(t*6+i)*4);path(null,OUT,10)}}
 else if(sp.hat==='beanie'){ctx.beginPath();ctx.arc(0,top+bh*.3,bw*.7,PI,2*PI);ctx.closePath();path(hc);rrect(-bw*.75,top+bh*.18,bw*1.5,34,14,shade(hc,.3));ell(0,top+bh*.3-bw*.7-8,22,22,shade(hc,.4))}
 else if(sp.hat==='band'){ctx.save();ctx.beginPath();ctx.moveTo(0,cy-bh);ctx.bezierCurveTo(bw*1.05,cy-bh,bw*1.1,cy+bh*.2,bw*.95,cy+bh*.7);ctx.lineTo(-bw*.95,cy+bh*.7);ctx.bezierCurveTo(-bw*1.1,cy+bh*.2,-bw*1.05,cy-bh,0,cy-bh);ctx.clip();rrect(-bw*1.2,top+bh*.12,bw*2.4,30,0,hc,OUT,6);ctx.restore();line([bw*.9,top+bh*.18,bw*1.3,top+bh*.1+Math.sin(t*8)*8],hc,12);line([bw*.9,top+bh*.2,bw*1.25,top+bh*.3+Math.sin(t*8+1)*8],hc,12)}
 else if(sp.hat==='crown'){ctx.beginPath();ctx.moveTo(-bw*.5,top+10);ctx.lineTo(-bw*.5,top-60);ctx.lineTo(-bw*.25,top-25);ctx.lineTo(0,top-75);ctx.lineTo(bw*.25,top-25);ctx.lineTo(bw*.5,top-60);ctx.lineTo(bw*.5,top+10);ctx.closePath();path('#ffcc22')}
 // arms on top
 const hl=arm(-1,p.armL??-60,p.reachL,p.holdL),hr=arm(1,p.armR??-60,p.reachR,p.holdR);
 ctx.restore();
}
// ---------- props ----------
function pizza(s=1,bitten=0){ctx.save();ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,70);ctx.lineTo(-58,-50);ctx.quadraticCurveTo(0,-72,58,-50);ctx.closePath();path('#ffcf4a',OUT,7);
 ctx.save();ctx.clip();rrect(-70,-80,140,30,10,'#d98b3a',null);for(const[a,b]of[[-18,-20],[16,-8],[-4,22],[22,-34],[-30,-36]])ell(a,b,10,10,'#d6342c',OUT,4);
 if(bitten)for(let i=0;i<3;i++)ell(-10+i*14,60,14,14,'#000',null);ctx.restore();
 ctx.beginPath();ctx.moveTo(-58,-50);ctx.quadraticCurveTo(0,-72,58,-50);path(null,'#b06a28',16);ctx.restore()}
function crust(s=1){ctx.save();ctx.scale(s,s);ctx.beginPath();ctx.moveTo(-58,-6);ctx.quadraticCurveTo(0,-30,58,-6);path(null,OUT,26);ctx.beginPath();ctx.moveTo(-58,-6);ctx.quadraticCurveTo(0,-30,58,-6);path(null,'#c77d33',16);ctx.restore()}
function bird(x,y,s,flap,opts={}){ctx.save();ctx.translate(x,y);ctx.scale(s*(opts.flip?-1:1),s);
 const wa=Math.sin(flap)*0.9;
 ctx.save();ctx.translate(-10,-20);ctx.rotate(-wa);ctx.beginPath();ctx.ellipse(-30,0,48,20,-.3,0,2*PI);path('#7d8aa3',OUT,6);ctx.restore();
 ell(0,0,55,42,'#9aa6bd',OUT,7);ell(10,14,32,22,'#b9a7c9',null);
 ell(42,-34,28,28,'#9aa6bd',OUT,7);ctx.save();ctx.globalAlpha=.6;ell(36,-14,16,8,'#6ec8a0',null);ctx.restore();
 ell(50,-40,9,9,'#fff',OUT,4);ell(52+(opts.lookX||0)*3,-40,4,4,OUT,null);
 if(opts.smug)line([42,-52,58,-48],OUT,5);
 ctx.beginPath();ctx.moveTo(66,-34);ctx.lineTo(90,-28);ctx.lineTo(66,-22);ctx.closePath();path('#f2a23a',OUT,5);
 ctx.beginPath();ctx.moveTo(-50,-4);ctx.lineTo(-90,-18);ctx.lineTo(-84,10);ctx.closePath();path('#7d8aa3',OUT,6);
 if(!opts.fly){line([-6,40,-12,62],'#f2a23a',7);line([14,40,18,62],'#f2a23a',7)}
 if(opts.hold){ctx.save();ctx.translate(82,-24);opts.hold();ctx.restore()}
 ctx.save();ctx.translate(10,-20);ctx.rotate(wa);ctx.beginPath();ctx.ellipse(-28,0,50,20,.2,0,2*PI);path('#8794ad',OUT,6);ctx.restore();
 ctx.restore()}
function bulb(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);for(let i=0;i<8;i++){const a=i*PI/4;line([Math.cos(a)*70,Math.sin(a)*70-10,Math.cos(a)*95,Math.sin(a)*95-10],'#ffd23f',8)}
 ell(0,-10,48,52,'#fff27a',OUT,7);rrect(-22,36,44,30,6,'#aab',OUT,6);ctx.restore()}
function balloon(x,y,ax,ay,col,t,i){const bx=x+Math.sin(t*2+i)*8;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo((ax+bx)/2+Math.sin(t*3+i)*12,(ay+y)/2,bx,y+60);path(null,OUT,3);
 ell(bx,y,48,60,col,OUT,6);ell(bx-16,y-22,10,16,'rgba(255,255,255,.6)',null);ctx.beginPath();ctx.moveTo(bx-8,y+66);ctx.lineTo(bx+8,y+66);ctx.lineTo(bx,y+56);ctx.closePath();path(col,OUT,4)}
// ---------- effects ----------
function sparkle(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.rotate(t*2);ctx.scale(s,s);ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?10:34,a=i*PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();path('#fff6a0','#f5b700',4);ctx.restore()}
function burst(x,y,s,col='#ffd23f',col2='#ff5a3c'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);for(const[r1,r2,c]of[[160,90,col2],[110,60,col]]){ctx.beginPath();for(let i=0;i<24;i++){const r=i%2?r2:r1*(0.8+rnd(i)*.4),a=i*PI/12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();path(c,OUT,7)}ctx.restore()}
function mark(x,y,s,ch,col='#ff3b3b'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.font='900 130px Arial Black, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.lineWidth=16;ctx.strokeStyle=OUT;ctx.strokeText(ch,0,0);ctx.fillStyle=col;ctx.fillText(ch,0,0);ctx.restore()}
function sweat(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,-30);ctx.quadraticCurveTo(20,0,0,14);ctx.quadraticCurveTo(-20,0,0,-30);path('#8fd3ff',OUT,5);ctx.restore()}
function heart(x,y,s,col='#ff4f7b'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,20);ctx.bezierCurveTo(-50,-10,-25,-50,0,-22);ctx.bezierCurveTo(25,-50,50,-10,0,20);path(col,OUT,6);ctx.restore()}
function dizzy(x,y,t,r=70){for(let i=0;i<3;i++){const a=t*6+i*2*PI/3;sparkle(x+Math.cos(a)*r,y+Math.sin(a)*r*.35,.8,t)}}
function speedLines(x,y,dir,len,n,t,col=OUT){ctx.save();ctx.globalAlpha=.55;for(let i=0;i<n;i++){const oy=(rnd(i+3)-.5)*160,ox=rnd(i*7+Math.floor(t*20))*60;line([x-dir*(ox),y+oy,x-dir*(ox+len*(.5+rnd(i)*.5)),y+oy],col,6)}ctx.restore()}
function vignette(a=.35){const g=ctx.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function iris(t,cx,cy){ // t 0 open -> 1 closed
 const r=(1-t)*1400;ctx.save();ctx.fillStyle='#000';ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(cx,cy,Math.max(r,0),0,2*PI,true);ctx.fill();ctx.restore()}
function halftone(col='rgba(255,255,255,.08)'){ctx.fillStyle=col;for(let y=0;y<H;y+=36)for(let x=(y/36%2)*18;x<W;x+=36){ctx.beginPath();ctx.arc(x,y,6,0,2*PI);ctx.fill()}}
// camera: cam={x,y,z,rot,shake}
function withCam(cam,t,fn){ctx.save();const sh=cam.shake||0;const dx=sh?(rnd(Math.floor(t*40))-.5)*sh*2:0,dy=sh?(rnd(Math.floor(t*40)+99)-.5)*sh*2:0;
 ctx.translate(W/2+dx,H/2+dy);ctx.scale(cam.z||1,cam.z||1);ctx.rotate((cam.rot||0)*PI/180);ctx.translate(-(cam.x??W/2),-(cam.y??H/2));fn();ctx.restore()}
function render(t){ctx.setTransform(1,1e-9,0,1,0,0);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);scene(t)}
</script></body></html>
